<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLEN</title>

    <!-- A hosted app (hosted/README.md). The same page is served at
         /a/<slug>/ for each app in the registry, with a <base> pointing back
         here, so every path below is relative to hosted/map/. -->
    <!--BASE-->
    <link rel="icon" type="image/svg+xml" href="../../app/assets/favicon.svg">

    <!-- glen core adds MapLibre, PMTiles, the chat's libraries and glen's
         stylesheets itself, with their integrity hashes
         (docs/design/page-dependencies.md). An app's own stylesheet goes here,
         after them. -->
    <style>
        /* Boot placeholder — see #boot-status in the body. */
        #boot-status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font: 14px/1.4 system-ui, sans-serif;
            color: #666;
            text-align: center;
        }
        #map.maplibregl-map #boot-status { display: none; }
        #boot-status p { margin: 0 0 .75em; max-width: 32em; }
    </style>
</head>

<body>
    <!-- Map -->
    <!-- #boot-status makes a failed module load read as "stuck loading" rather
         than an unexplained blank page. MapLibre puts .maplibregl-map on this
         container once the map exists, which hides it again — no JS needed (#343). -->
    <div id="map">
        <div id="boot-status">Loading map modules…</div>
    </div>

    <!-- Layer controls — generated by MapManager.generateMenu() -->
    <div id="menu"></div>

    <!-- App bootstrap -->
    <script type="module" src="../runtime.js"></script>
</body>

</html>
