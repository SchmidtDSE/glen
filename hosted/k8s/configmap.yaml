# The hosted app on NRP (hosted/README.md). Three files, none secret:
#
#   deployment.json      this deployment's settings: plugins, MCP path, registry.
#                        Replaces hosted/deployment.json (the GitHub Pages one).
#   config.template.json the model service (this pod's /api/llm, whose /models
#                        lists the models). Written to hosted/config.json with
#                        ${MCP_SERVER_URL} filled in.
#   nginx.conf.template  /api/llm and /api/mcp with the keys added server-side,
#                        as in glen-template's k8s/configmap.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: glen-maps-config
  namespace: schmidtdse
data:
  deployment.json: |
    {
        "name": "GLEN on NRP",
        "about": "Models and the SQL server run on the National Research Platform; visitors need no key.",
        "registry": "apps/",
        "registry_path": "hosted/apps",
        "examples": [
            {
                "slug": "jamaica",
                "title": "Jamaica after Hurricane Melissa"
            },
            {
                "slug": "st-louis",
                "title": "St. Louis open data"
            }
        ],
        "allow_unlisted": true,
        "runtime_config": "config.json",
        "titiler_url": "https://titiler.nrp-nautilus.io",
        "catalog": "https://s3-west.nrp-nautilus.io/public-data/stac/catalog.json",
        "repo": "SchmidtDSE/glen",
        "defaults": {
            "default_basemap": "natgeo",
            "auto_approve": true,
            "sidebar": {
                "enabled": true,
                "chat_title": "Chat"
            },
            "geocoder": {
                "provider": "nominatim"
            },
            "links": {
                "docs": "https://schmidtdse.github.io/glen/",
                "carbon": true
            }
        },
        "default_plugins": [
            "mcp",
            "hex",
            "charts",
            "controls"
        ],
        "plugins": {
            "mcp": {
                "label": "SQL over the data, on the server",
                "url": "../core/plugins/mcp.js",
                "options": {
                    "url": "/api/mcp",
                    "prompt": "geospatial-analyst"
                }
            },
            "hex": {
                "label": "Hex maps from SQL",
                "url": "../core/plugins/hex.js"
            },
            "charts": {
                "label": "Charts from SQL",
                "url": "../core/plugins/charts.js"
            },
            "controls": {
                "label": "Settings controls the agent can add",
                "url": "../core/plugins/controls.js"
            },
            "draw": {
                "label": "Draw a region",
                "url": "../core/plugins/draw.js"
            },
            "geolocate": {
                "label": "Locate me",
                "url": "../core/plugins/geolocate.js",
                "options": {
                    "button": true,
                    "agent_tool": true
                }
            }
        }
    }
  config.template.json: |
    {
        "mcp_server_url": "${MCP_SERVER_URL}",
        "llm_endpoint": "/api/llm",
        "transcription_model": {
            "value": "gemma-small",
            "endpoint": "/api/llm",
            "api_key": "unused"
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: glen-maps-nginx
  namespace: schmidtdse
data:
  nginx.conf.template: |
    # ── Per-client limits on the LLM and MCP paths (glen-ops#246) ──
    # $client_addr is the last X-Forwarded-For entry, the one HAProxy appends
    # from the connection it actually received, so a client cannot choose it by
    # sending its own header. In-cluster callers have no XFF and fall back to
    # $remote_addr. Values were set from proxy-log measurements (see the PR).
    map $http_x_forwarded_for $client_addr {
        "~(?:^|,)\s*(?<last>[^,\s]+)\s*$" $last;
        default $remote_addr;
    }
    limit_req_zone $client_addr zone=llm:10m rate=60r/m;
    limit_req_zone $client_addr zone=mcp:10m rate=60r/m;
    limit_conn_zone $client_addr zone=addr:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Accept";

        # ── Reverse proxy to open-llm-proxy ──────────────────────────
        # config.json sets no llm_api_key, so clients send no bearer token
        # (SchmidtDSE/glen#542); nginx sets the Authorization header,
        # whatever the browser sends, from the
        # ${PROXY_KEY} substituted in at container startup. The browser
        # never receives the key.
        #
        # In-cluster upstream (geo-agent-ops#73): proxy the open-llm-proxy
        # ClusterIP service directly over HTTP inside the cluster, NOT its
        # public hostname (open-llm-proxy.nrp-nautilus.io). Routing through the
        # public ingress exposed the app to NRP's heterogeneous edge: nginx
        # latched onto a single flapping anycast VIP and hard-failed ~12% of
        # /api/llm connects (502/504 "while connecting to upstream") for a
        # resolver window — invisible in the proxy logs because the request
        # died here, at the app's nginx, before reaching the proxy. It also
        # subsumes the earlier IPv6-unreachable failure the #64 IPv4-forcing
        # block worked around: an in-cluster ClusterIP is IPv4 and single-VIP,
        # so both failure modes disappear. The Origin header still forwards by
        # default, so proxy logging/routing is unchanged.
        #
        # Since 2026-11-11 this app runs in schmidtdse and uses schmidtdse's own
        # proxy (open-llm-proxy#176): NRP drops pod traffic between namespaces.
        # Only two calls are relayed (glen-ops#246): POST chat/completions
        # (chat and transcription) and GET models. Any other path or method
        # under /api/llm/ is answered here and never reaches the proxy.
        location = /api/llm/chat/completions {
            limit_except POST { deny all; }
            proxy_pass http://open-llm-proxy.schmidtdse.svc.cluster.local:8002/v1/chat/completions;
            proxy_set_header Authorization "Bearer ${PROXY_KEY}";
            proxy_set_header X-Glen-App "glen-maps";
            proxy_set_header X-Real-IP $client_addr;
            limit_req zone=llm burst=30 nodelay;
            limit_conn addr 20;

            # Allow long agent loops (multi-turn tool use). 600s keeps the
            # timeout uniform across the whole chain: the geo-agent client
            # defaults to 600s (app/agent.js _llmTimeoutMs) and open-llm-proxy's
            # httpx timeout is 600s, so this sidecar was the odd hop at 300s —
            # cutting off slow-decode models (e.g. glm-5.2) the rest of the
            # chain would still wait for.
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # Don't buffer streaming responses
            proxy_buffering off;
        }

        location = /api/llm/models {
            limit_except GET { deny all; }
            proxy_pass http://open-llm-proxy.schmidtdse.svc.cluster.local:8002/v1/models;
            proxy_set_header Authorization "Bearer ${PROXY_KEY}";
            proxy_set_header X-Glen-App "glen-maps";
            proxy_set_header X-Real-IP $client_addr;
            limit_req zone=llm burst=30 nodelay;
            limit_conn addr 20;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        location /api/llm/ {
            return 404;
        }

        # Reverse proxy to the shared DuckDB MCP server. The server requires a
        # bearer token (geo-query#453); nginx attaches it from ${MCP_AUTH_TOKEN}
        # so the browser never holds it, and proxies the in-cluster Service
        # rather than the public hostname (glen-ops#73).
        # Since 2026-11-11 this app runs in schmidtdse and uses schmidtdse's own copy
        # of the server, because pods here cannot reach Services in biodiversity.
        # The token is the key the public apps share (Secret duckdb-mcp-tokens, key
        # public); X-Glen-App names the app, as on /api/llm/.
        location /api/mcp {
            proxy_pass http://duckdb-mcp.schmidtdse.svc.cluster.local:8000/mcp;
            # register_hex_tiles returns tile URLs on the server's in-cluster address,
            # which browsers cannot reach. Rewrite them to this app's /tiles/ (below).
            proxy_set_header Accept-Encoding "";
            sub_filter 'http://duckdb-mcp.schmidtdse.svc.cluster.local:8000/tiles/' 'https://$host/tiles/';
            sub_filter_once off;
            sub_filter_types text/event-stream application/json;
            proxy_http_version 1.1;
            proxy_set_header Host duckdb-mcp.schmidtdse.svc.cluster.local;
            proxy_set_header Connection "";
            proxy_set_header Authorization "Bearer ${MCP_AUTH_TOKEN}";
            proxy_set_header X-Glen-App "glen-maps";
            proxy_set_header X-Real-IP $client_addr;
            limit_req zone=mcp burst=120 nodelay;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        # Hex tiles from register_hex_tiles, served through the app with its token.
        location /tiles/ {
            limit_except GET { deny all; }
            proxy_pass http://duckdb-mcp.schmidtdse.svc.cluster.local:8000/tiles/;
            proxy_http_version 1.1;
            proxy_set_header Host duckdb-mcp.schmidtdse.svc.cluster.local;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $client_addr;
            proxy_set_header Authorization "Bearer ${MCP_AUTH_TOKEN}";
            proxy_set_header X-Glen-App "glen-maps";
        }

        # /a/<slug>/ is a page per published app (scripts/stage-hosted.sh);
        # an unknown app is a 404, not the builder.
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
